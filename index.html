<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>双层住宅 3D 样板间 · Duplex House</title>
<style>
  :root{--bg:#12100e;--fg:#f2ede6;--acc:#c9a227;--panel:rgba(24,21,18,.82);--line:rgba(242,237,230,.16)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* 加载页 */
  #loader{position:fixed;inset:0;background:#12100e;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;z-index:50;transition:opacity .6s}
  #loader.hide{opacity:0;pointer-events:none}
  #loader h1{margin:0;font-size:19px;font-weight:500;letter-spacing:.32em;text-transform:uppercase}
  #loader .sub{font-size:12px;opacity:.45;letter-spacing:.18em;margin-top:-14px}
  #bar{width:240px;height:1px;background:rgba(242,237,230,.14);position:relative;overflow:hidden}
  #bar i{position:absolute;inset:0 100% 0 0;background:var(--acc);transition:right .25s ease}
  #ltxt{font-size:11px;opacity:.5;letter-spacing:.1em;min-height:16px}
  #lerr{color:#e07a5f;font-size:12px;max-width:70vw;text-align:center;line-height:1.7}

  /* UI */
  #ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;
    background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);
    border-radius:999px;padding:5px;z-index:20}
  #ui button{appearance:none;border:0;background:transparent;color:var(--fg);opacity:.62;
    padding:9px 17px;border-radius:999px;cursor:pointer;font-size:13px;letter-spacing:.05em;transition:.18s}
  #ui button:hover{opacity:1;background:rgba(242,237,230,.07)}
  #ui button.on{opacity:1;background:var(--acc);color:#1a1512;font-weight:500}

  #hint{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:var(--panel);
    backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:10px;padding:9px 16px;
    font-size:12.5px;letter-spacing:.03em;z-index:20;opacity:.9;pointer-events:none;transition:opacity .3s}
  #hint b{color:var(--acc);font-weight:600}
  /* 小地图 */
  #minimap{position:fixed;right:16px;top:16px;z-index:20;background:var(--panel);
    backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;padding:8px;
    opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .35s,transform .35s}
  #minimap.show{opacity:1;transform:none}
  #minimap canvas{display:block;border-radius:6px;background:rgba(12,10,9,.35)}
  #minimap .mm-label{margin-top:6px;font-size:11.5px;letter-spacing:.04em;opacity:.75;text-align:center}
  #minimap .mm-label b{color:var(--acc);margin-right:5px}

  #hud{position:fixed;right:16px;bottom:16px;font-size:11px;opacity:.4;z-index:20;
    font-variant-numeric:tabular-nums;text-align:right;line-height:1.6}

  /* 户型图 Overlay */
  #plan{position:fixed;inset:0;background:rgba(12,10,9,.9);z-index:30;display:none}
  #plan.show{display:block}
  #planvp{position:absolute;inset:0;overflow:hidden;cursor:grab}
  #planvp.drag{cursor:grabbing}
  #planwrap{position:absolute;left:50%;top:50%;transform-origin:0 0;will-change:transform}
  #planwrap img,#planwrap svg{display:block;max-width:none;background:#fbf9f6;border-radius:4px}
  #planbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;
    align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 8px}
  #planbar button{appearance:none;border:0;background:transparent;color:var(--fg);opacity:.7;
    width:32px;height:28px;border-radius:8px;cursor:pointer;font-size:15px}
  #planbar button:hover{opacity:1;background:rgba(242,237,230,.08)}
  #plannote{position:absolute;left:18px;top:18px;font-size:11.5px;opacity:.92;letter-spacing:.05em;
    background:var(--panel);backdrop-filter:blur(14px);border:1px dashed var(--line);border-radius:6px;
    padding:8px 12px;line-height:1.7;max-width:44ch}
  #plannote b{color:var(--acc)}
  #plannote code{background:rgba(242,237,230,.1);padding:1px 4px;border-radius:3px}
  #planclose{position:absolute;right:18px;top:16px;background:var(--panel);border:1px solid var(--line);
    color:var(--fg);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>

<div id="loader">
  <h1>Duplex House</h1>
  <div class="sub">14.9 m × 13.2 m · 两层 · 概念参考方案</div>
  <div id="bar"><i></i></div>
  <div id="ltxt">初始化…</div>
  <div id="lerr"></div>
</div>

<div id="hint"></div>
<div id="hud"></div>
<div id="minimap"><canvas></canvas><div class="mm-label"></div></div>

<div id="ui">
  <button data-v="fps">第一人称</button>
  <button data-v="axo" class="on">双层轴测</button>
  <button data-v="plan">户型图</button>
  <button data-v="night">白天 / 夜晚</button>
</div>

<div id="plan">
  <div id="planvp"><div id="planwrap"></div></div>
  <div id="plannote"></div>
  <button id="planclose">关闭 (Esc)</button>
  <div id="planbar">
    <button data-p="out">−</button><button data-p="fit">⤢</button><button data-p="in">+</button>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
